display_information:
  name: Slack Agent
  description: Internal coding coworker. A mention in a mapped channel starts a thread-bound conversation.
features:
  bot_user:
    display_name: Slack Agent
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - groups:history
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
