display_information:
  name: Slack Agent
  description: Internal coding coworker. Mention it in a channel or DM it to start a thread-bound conversation.
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Slack Agent
    always_online: true
  # Replace the host with your tunnel or Worker host (README "Slack app").
  slash_commands:
    - command: /aiyappa
      url: https://example.invalid/channels/slack/commands
      description: List models, or connect, check, or disconnect the ChatGPT subscription
      usage_hint: models | openai connect|status|disconnect
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - channels:history
      - groups:history
      - im:history
      - files:read
settings:
  event_subscriptions:
    request_url: https://example.invalid/channels/slack/events
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true
    request_url: https://example.invalid/channels/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
